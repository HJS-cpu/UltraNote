name: Build UltraNote

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned to windows-2022 (VS 2022 / v17). windows-latest is migrating to
    # Windows Server 2025 + Visual Studio 2026 (v18.x) by 2026-06-15, which would
    # break the "Visual Studio 17 2022" generator below and drops the Win10 SDK.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022"

      - name: Build Release
        run: cmake --build build --config Release

      - name: Create portable ZIP
        run: Compress-Archive -Path build/Release/UltraNote.exe, build/Release/lang -DestinationPath UltraNote-Portable.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: UltraNote-Portable
          path: |
            build/Release/UltraNote.exe
            build/Release/lang

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: "UltraNote ${{ github.ref_name }}"
          body_path: RELEASE.md
          files: UltraNote-Portable.zip
