stages:
  - build
  - upload
  - release

# ==============================================================================
# Stage 1: Build (GitLab SaaS Windows Runner)
# ==============================================================================
build:
  stage: build
  tags:
    - saas-windows-medium-amd64
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - |
      @'
      @echo off
      setlocal enabledelayedexpansion

      REM === Find CMake ===
      set "CMAKE_EXE="
      where cmake >nul 2>&1
      if not errorlevel 1 (
        set "CMAKE_EXE=cmake"
      )
      if not defined CMAKE_EXE (
        if exist "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe" (
          set "CMAKE_EXE=C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"
        )
      )
      if not defined CMAKE_EXE (
        if exist "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe" (
          set "CMAKE_EXE=C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"
        )
      )
      if not defined CMAKE_EXE (
        if exist "C:\Program Files\Microsoft Visual Studio\2022\BuildTools\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe" (
          set "CMAKE_EXE=C:\Program Files\Microsoft Visual Studio\2022\BuildTools\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"
        )
      )
      if not defined CMAKE_EXE (
        echo ERROR: Could not find CMake
        exit /b 1
      )

      echo Using CMake: !CMAKE_EXE!

      echo === Configuring (Release) ===
      "!CMAKE_EXE!" -B build -G "Visual Studio 17 2022"
      if errorlevel 1 exit /b 1

      echo === Building Release ===
      "!CMAKE_EXE!" --build build --config Release
      if errorlevel 1 exit /b 1

      echo === Build complete ===
      dir build\Release\UltraNote.exe
      '@ | Set-Content -Path ci-build.bat -Encoding ASCII
    - cmd /c ci-build.bat

    # --- Create portable ZIP ---
    - Compress-Archive -Path build\Release\UltraNote.exe, build\Release\lang -DestinationPath UltraNote-Portable.zip
  artifacts:
    paths:
      - UltraNote-Portable.zip
    expire_in: 1 week

# ==============================================================================
# Stage 2: Upload package (Windows Runner, only on tags)
# ==============================================================================
upload:
  stage: upload
  tags:
    - saas-windows-medium-amd64
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - |
      $baseUrl = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/ultranote/$env:CI_COMMIT_TAG"
      $headers = @{ "JOB-TOKEN" = $env:CI_JOB_TOKEN }

      Write-Host "Uploading UltraNote-Portable.zip..."
      Invoke-RestMethod -Uri "$baseUrl/UltraNote-Portable.zip" -Method Put -Headers $headers -InFile UltraNote-Portable.zip

      Write-Host "Upload complete."

# ==============================================================================
# Stage 3: Create GitLab Release (Linux, only on tags)
# ==============================================================================
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: upload
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "UltraNote $CI_COMMIT_TAG"
    description: './RELEASE.md'
    assets:
      links:
        - name: "UltraNote-Portable.zip"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ultranote/${CI_COMMIT_TAG}/UltraNote-Portable.zip"
          link_type: "package"
